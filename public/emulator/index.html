<!doctype html>
<html lang = "en">
    <head>
        <meta charset = "utf-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>ARCADE</title>
        <style>
            body, html 
            {
                margin : 0;
                padding: 0;
            }

            div#game_holder
            {
                margin: 0 auto;
            }
        </style>
    </head>

    <body>
        <div id = "game_holder" style='width:640px;height:480px;max-width:100%'>
            <div id='game'></div>
        </div>

        <script type='text/javascript'>
        EJS_player = '#game';

        // Can also be snes9x or bsnes
        EJS_core = 'snes';

        //SNES mouse
        EJS_mouse = false; 

        // SNES Multitap
        EJS_multitap = false; 

        // URL to BIOS file
        EJS_biosUrl = '';

        // URL to Game rom
        EJS_gameUrl = '/ROMS/00__JUPITER-SCOPE-v01.smc';
        EJS_startOnLoaded = false;
        EJS_backgroundImage = "/ROMS/jupiter-scope/jupiter-scope.png";

        // Path to the data directory
        EJS_pathtodata = 'data/';
        </script>
        <script src='data/loader.js'></script>
    </body>
</html>
